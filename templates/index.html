{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Chatbot</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts Link For Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" />
  </head>
  <body>

    <div class="chatbot">
        <header>
            <h2>PSU ChatBot 2.0</h2>
            <span class="close-btn material-symbols-outlined">close</span>
        </header>
        <ul class="chatbox">
            <li class="chat incoming">
                <span class="material-symbols-outlined">smart_toy</span>
                <p>Hi there <br>How can I help you today?</p>
            </li>
        </ul>
        <div class="chat-input">
            <textarea id="user-input" placeholder="Enter a message..." spellcheck="false" required></textarea>
            <span id="send-btn" class="material-symbols-rounded">send</span>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
   <script>
        $(document).ready(function() {
            const closeBtn = $(".close-btn");
            closeBtn.on("click", function() {
                $(".chatbot").hide();
            });

            const chatbotToggler = $(".chatbot-toggler");
            const chatbox = $(".chatbox");
            const chatInput = $("#user-input");
            const sendChatBtn = $("#send-btn");

            // Add a chat bubble. Text is set with .text(), never as HTML, so neither the
            // user's message nor the model's answer can inject markup or scripts.
            const addMessage = (type, text) => {
                const item = $('<li>').addClass('chat ' + type);
                if (type === 'incoming') {
                    item.append($('<span>').addClass('material-symbols-outlined').text('smart_toy'));
                }
                item.append($('<p>').text(text));
                chatbox.append(item);
                chatbox.scrollTop(chatbox[0].scrollHeight);
            };

            const sendMessage = () => {
                const userMessage = chatInput.val().trim();
                if (!userMessage) return;

                // Append the user's message to the chat
                addMessage('outgoing', userMessage);
                addMessage('incoming', 'Thinking...');
                chatInput.val(''); // Clear input field

                // AJAX call to send message to backend
                $.ajax({
                    url: '/api/chat/',
                    type: 'POST',
                    data: JSON.stringify({ message: userMessage }),
                    contentType: 'application/json',
                    success: function(data) {
                        // Remove typing indicator
                        chatbox.find('.incoming:last').remove();

                        addMessage('incoming', data.response);
                    },
                    error: function(xhr, status, error) {
                        chatbox.find('.incoming:last').remove();
                        addMessage('incoming', 'Sorry, something went wrong (' + (error || 'network error') + '). Please try again.');
                    }
                });
            }

            // Handle Enter key press
            chatInput.on("keydown", (e) => {
                if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 800) {
                    e.preventDefault();
                    sendMessage(); // Trigger the send message function
                }
            });

            // Send message when the send button is clicked
            sendChatBtn.on("click", sendMessage);

            // Toggle the chatbot visibility
            closeBtn.on("click", () => $('body').removeClass("show-chatbot"));
            chatbotToggler.on("click", () => $('body').toggleClass("show-chatbot"));
        });
    </script>
  </body>
</html>
